<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planeta Reggae Player</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;font-family:Arial,sans-serif;overflow-x:hidden}

.player{
  width:100%;
  max-width:1980px;
  height:80px;
  margin:0 auto;
  display:flex;
  align-items:center;
  background:#000;
  overflow:hidden;
  padding:0 8px 0 4px;
  gap:14px;
}

.logo-box,.lion-box{
  width:70px;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.logo,.lion{
  width:60px;
  height:60px;
  object-fit:contain;
  display:block;
}

.cover{
  width:58px;
  height:58px;
  border-radius:12px;
  object-fit:cover;
  background:#111;
  flex-shrink:0;
  box-shadow:0 0 12px rgba(255,180,0,.22);
}

.play-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  border:3px solid #b88a1d;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.25s;
  flex-shrink:0;
  background:transparent;
  position:relative;
}

.play-btn:hover{transform:scale(1.06)}
.play-btn::before,.play-btn::after{content:'';display:block}

.play-btn:not(.is-playing)::before{
  width:0;
  height:0;
  border-top:10px solid transparent;
  border-bottom:10px solid transparent;
  border-left:15px solid #d4aa16;
  margin-left:4px;
  filter:drop-shadow(0 0 4px rgba(255,215,0,.35));
}

.play-btn:not(.is-playing)::after{display:none}

.play-btn.is-playing::before,
.play-btn.is-playing::after{
  width:5px;
  height:16px;
  background:#d4aa16;
  border-radius:1px;
  box-shadow:0 0 5px rgba(255,215,0,.35);
}

.play-btn.is-playing::before{margin-right:4px}
.play-btn.is-playing::after{margin-left:4px}

.now-box{
  width:430px;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  flex-shrink:0;
  overflow:hidden;
}

.now-title{
  width:112px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
  flex-shrink:0;
}

.now-label{
  font-size:12px;
  font-weight:700;
  color:#d8b13e;
  line-height:1;
  white-space:nowrap;
}

.station-name{
  font-size:10px;
  font-weight:700;
  color:rgba(255,255,255,.72);
  text-transform:uppercase;
  letter-spacing:1px;
  line-height:1;
  margin-top:6px;
  white-space:nowrap;
}

.info{
  flex:1;
  min-width:0;
  height:22px;
  overflow:hidden;
  display:flex;
  align-items:center;
}

.music-marquee{
  display:flex;
  width:max-content;
  animation:marqueeMusic 18s linear infinite;
}

.music{
  font-size:12px;
  font-weight:700;
  color:#fff;
  letter-spacing:.6px;
  white-space:nowrap;
  text-transform:uppercase;
  padding-right:60px;
}

.separator{
  width:1px;
  height:64px;
  background:linear-gradient(180deg,transparent,rgba(255,215,0,.75),transparent);
  flex-shrink:0;
}

.volume-box{
  width:150px;
  height:32px;
  border-radius:30px;
  border:2px solid rgba(255,255,255,.45);
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding:0 16px;
  flex-shrink:0;
  background:#050505;
  position:relative;
  overflow:hidden;
}

.volume-icon{
  width:100%;
  height:18px;
  border-radius:30px;
  background:#1b1b1b;
  position:relative;
  overflow:hidden;
  animation:volumeBlink 2.4s infinite ease-in-out;
  pointer-events:none;
}

.volume-level{
  width:70%;
  height:100%;
  border-radius:30px;
  display:block;
  background:linear-gradient(90deg,#8c6a18,#d8b13e,#ffe16a);
  box-shadow:0 0 10px rgba(216,177,62,.45);
}

.volume-icon::before,
.volume-icon::after{
  content:'';
  position:absolute;
  border:2px solid rgba(255,215,0,.72);
  border-left:none;
  border-radius:50%;
  top:50%;
  transform:translateY(-50%);
  pointer-events:none;
}

.volume-icon::before{
  right:10px;
  width:8px;
  height:8px;
  animation:wave1 1.8s infinite;
}

.volume-icon::after{
  right:4px;
  width:12px;
  height:12px;
  animation:wave2 1.8s infinite;
}

.volume-slider{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  cursor:pointer;
}

.visualizer{
  height:42px;
  width:390px;
  min-width:260px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:5px;
  flex-shrink:0;
  padding:0 2px;
}

.bar{
  width:5px;
  height:8px;
  border-radius:8px 8px 2px 2px;
  background:linear-gradient(
    180deg,
    #fff8b8 0%,
    #ffe16a 22%,
    #d9a400 62%,
    #8b6200 100%
  );
  box-shadow:
    0 0 5px rgba(255,230,105,.80),
    0 0 12px rgba(255,198,32,.48),
    0 0 18px rgba(180,122,0,.28);
  opacity:.95;
  will-change:height,opacity;
}

.end-box{
  margin-left:auto;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:12px;
  flex-shrink:0;
}

.date{
  width:132px;
  color:#fff;
  text-align:center;
  flex-shrink:0;
}

.time{font-size:17px;font-weight:800;line-height:1}
.day{font-size:10px;opacity:.82;letter-spacing:1px;margin-top:5px;white-space:nowrap}

@media(max-width:1280px){
  .visualizer{width:260px}
  .now-box{width:330px}
}

@media(max-width:980px){
  .player{gap:10px}
  .logo-box,.lion-box{width:58px}
  .logo,.lion{width:50px;height:50px}
  .cover{width:52px;height:52px}
  .play-btn{width:38px;height:38px}
  .visualizer{display:none}
  .volume-box{width:124px}
}

@media(max-width:760px){
  .date,.separator.before-end,.lion-box{display:none}
  .now-box{width:230px}
  .now-title{width:96px}
  .music{font-size:11px}
}

@media(max-width:560px){
  .volume-box{display:none}
  .now-box{flex:1;min-width:130px;gap:10px}
  .now-title{width:88px}
  .logo-box{width:48px}
  .logo{width:44px;height:44px}
  .cover{width:46px;height:46px}
}

@keyframes marqueeMusic{
  0%{transform:translateX(0)}
  100%{transform:translateX(-50%)}
}

@keyframes volumeBlink{
  0%,100%{opacity:.58}
  50%{opacity:1}
}

@keyframes wave1{
  0%{opacity:.25}
  50%{opacity:1}
  100%{opacity:.25}
}

@keyframes wave2{
  0%{opacity:.15}
  50%{opacity:.85}
  100%{opacity:.15}
}
</style>
</head>

<body>

<div class="player">

  <div class="logo-box">
    <img
      src="./globo-sem-fundo.png"
      onerror="this.onerror=null;this.src='file:///H:/Site%20Planet%20Reggae%202026/Player%201/globo-sem-fundo.png';"
      class="logo"
      alt="Planeta Reggae">
  </div>

  <img
    id="cover"
    src="https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg"
    class="cover"
    alt="Capa da música">

  <button class="play-btn" id="playBtn" onclick="togglePlay()" aria-label="Tocar ou pausar"></button>

  <div class="now-box">
    <div class="now-title">
      <div class="now-label">Tocando Agora:</div>
      <div class="station-name">Planeta Reggae</div>
    </div>

    <div class="info">
      <div class="music-marquee" id="musicMarquee">
        <div id="musicA" class="music">AGUARDANDO</div>
        <div id="musicB" class="music">AGUARDANDO</div>
      </div>
    </div>
  </div>

  <div class="separator"></div>

  <div class="volume-box">
    <div class="volume-icon">
      <span class="volume-level" id="volumeLevel"></span>
    </div>

    <input
      id="volume"
      class="volume-slider"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="0.70"
      aria-label="Volume">
  </div>

  <div class="visualizer" id="visualizer"></div>

  <div class="separator before-end"></div>

  <div class="end-box">
    <div class="date">
      <div id="time" class="time">00:00</div>
      <div id="day" class="day">CARREGANDO DATA</div>
    </div>

    <div class="lion-box">
      <img src="https://xatimg.com/image/m4ADm2ig8biw.png" class="lion" alt="Leão">
    </div>
  </div>

</div>

<audio id="audio" crossorigin="anonymous" preload="none">
  <source src="https://servidor13-1.brlogic.com:7020/live" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const volume = document.getElementById('volume');
const volumeLevel = document.getElementById('volumeLevel');
const visualizer = document.getElementById('visualizer');

const STREAM_URL = 'https://servidor13-1.brlogic.com:7020/live';

const BRLOGIC_STATUS_URL =
  'https://d36nr0u3xmc4mm.cloudfront.net/index.php/api/streaming/status/7020/47357dd712d0c8355f00495dce2e846d/SV30BR';

const BRLOGIC_COVER_URL =
  'https://brlogic-api.minhawebradio.net/api/streaming/song-cover?q={songName}&base-date=2026-05-26&hash=10bd95bc076dfc84ba370362cf66c3a6b13ea4de';

const BRLOGIC_COVER_BASE =
  'https://public-rf-song-cover.minhawebradio.net/';

const DEFAULT_COVER =
  'https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg';

let playing = false;
let audioContext;
let analyser;
let sourceNode;
let dataArray;
let lastTitle = '';
let lastCoverTitle = '';
let visualizerFrame;
let visualTick = 0;
let audioEnergy = .45;
let smoothEnergy = .45;

const barsTotal = 56;
const center = (barsTotal - 1) / 2;

for(let i = 0; i < barsTotal; i++){
  const bar = document.createElement('div');
  bar.className = 'bar';
  visualizer.appendChild(bar);
}

function normalizeTitle(title){
  return String(title || '')
    .replace(/&nbsp;/g,' ')
    .replace(/&#039;/g,"'")
    .replace(/&amp;/g,'&')
    .replace(/\s+/g,' ')
    .replace(/^[-–—•,\s]+|[-–—•,\s]+$/g,'')
    .trim();
}

function setMusicText(text){
  const title = normalizeTitle(text || 'AGUARDANDO');

  if(title === lastTitle) return;
  lastTitle = title;

  const finalText = `${title} • `;
  document.getElementById('musicA').textContent = finalText;
  document.getElementById('musicB').textContent = finalText;

  const marquee = document.getElementById('musicMarquee');
  marquee.style.animation = 'none';
  void marquee.offsetWidth;
  marquee.style.animation = 'marqueeMusic 18s linear infinite';
}

function updateVolumeDesign(){
  const percent = Number(volume.value) * 100;
  volumeLevel.style.width = `${percent}%`;
}

volume.addEventListener('input', () => {
  audio.volume = volume.value;
  updateVolumeDesign();
});

audio.volume = volume.value;
updateVolumeDesign();

async function togglePlay(){
  try{
    if(playing){
      audio.pause();
      playing = false;
      playBtn.classList.remove('is-playing');
      return;
    }

    audio.src = STREAM_URL;
    await audio.play();

    playing = true;
    playBtn.classList.add('is-playing');
    startAudioVisualizer();
    updateMetadata();

  }catch(error){
    console.log('Erro ao tocar:', error);
  }
}

function startAudioVisualizer(){
  try{
    if(!audioContext){
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      sourceNode = audioContext.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioContext.destination);
      analyser.fftSize = 128;
      analyser.smoothingTimeConstant = .18;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }

    if(audioContext.state === 'suspended'){
      audioContext.resume();
    }

  }catch(error){
    console.log('Visualizador decorativo:', error);
  }
}

function getAudioEnergy(){
  if(!playing || !analyser || !dataArray){
    return .28;
  }

  try{
    analyser.getByteFrequencyData(dataArray);

    let sum = 0;
    const limit = Math.min(18, dataArray.length);

    for(let i = 0; i < limit; i++){
      sum += dataArray[i];
    }

    return Math.min(1, Math.max(.22, (sum / limit) / 180));
  }catch(error){
    return .55;
  }
}

function animateBalancedVisualizer(){
  cancelAnimationFrame(visualizerFrame);
  const bars = document.querySelectorAll('.bar');

  function draw(){
    visualTick += playing ? .18 : .055;

    audioEnergy = getAudioEnergy();
    smoothEnergy += (audioEnergy - smoothEnergy) * .55;

    bars.forEach((bar,index) => {
      const distance = Math.abs(index - center) / center;

      const waveA = (Math.sin(visualTick + index * .42) + 1) / 2;
      const waveB = (Math.sin(visualTick * 1.55 - index * .30) + 1) / 2;
      const shape = Math.pow(1 - distance, .65);

      const rhythm = (waveA * .58) + (waveB * .42);
      const intensity = playing ? smoothEnergy : .38;

      const height =
        7 +
        (shape * 18) +
        (rhythm * 19 * intensity) +
        (Math.sin(visualTick * 2.2) + 1) * 2.2 * intensity;

      const finalHeight = Math.max(7, Math.min(42, height));

      bar.style.height = `${finalHeight}px`;
      bar.style.opacity = playing ? '.96' : '.76';
    });

    visualizerFrame = requestAnimationFrame(draw);
  }

  draw();
}

animateBalancedVisualizer();

function updateClock(){
  const now = new Date();

  document.getElementById('time').textContent =
    `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  const dias = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
  const meses = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

  document.getElementById('day').textContent =
    `${dias[now.getDay()]}, ${now.getDate()} ${meses[now.getMonth()]}`;
}

setInterval(updateClock,1000);
updateClock();

async function fetchJson(url){
  const response = await fetch(url, { cache:'no-store' });
  if(!response.ok) throw new Error('Falha ao buscar dados');
  return response.json();
}

async function fetchJsonWithProxy(url){
  const urls = [
    url,
    `https://corsproxy.io/?${encodeURIComponent(url)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
  ];

  for(const item of urls){
    try{
      return await fetchJson(item);
    }catch(error){}
  }

  throw new Error('Nenhum endpoint respondeu');
}

function cleanSongTitle(title){
  return normalizeTitle(title)
    .replace(/official audio/ig,'')
    .replace(/official video/ig,'')
    .replace(/lyrics/ig,'')
    .replace(/\(.*?\)/g,'')
    .replace(/\[.*?\]/g,'')
    .trim();
}

async function updateCoverFromBrlogic(title){
  const cleanTitle = cleanSongTitle(title);
  const url = BRLOGIC_COVER_URL.replace('{songName}', encodeURIComponent(cleanTitle));

  const data = await fetchJsonWithProxy(url);

  if(data && data.success && data.cover){
    document.getElementById('cover').src = BRLOGIC_COVER_BASE + data.cover;
    return true;
  }

  return false;
}

async function updateCoverFromDeezer(title){
  const cleanTitle = cleanSongTitle(title);

  if(!cleanTitle){
    document.getElementById('cover').src = DEFAULT_COVER;
    return;
  }

  const deezerUrl = `https://api.deezer.com/search?q=${encodeURIComponent(cleanTitle)}`;
  const data = await fetchJsonWithProxy(deezerUrl);

  if(data.data && data.data.length > 0){
    const album = data.data[0].album;
    const cover = album.cover_xl || album.cover_big || album.cover_medium || album.cover;

    if(cover){
      document.getElementById('cover').src = cover;
    }
  }
}

async function updateCover(title){
  try{
    if(!title || title === 'AGUARDANDO' || title === lastCoverTitle) return;
    lastCoverTitle = title;

    const foundBrlogic = await updateCoverFromBrlogic(title);

    if(!foundBrlogic){
      await updateCoverFromDeezer(title);
    }

  }catch(error){
    try{
      await updateCoverFromDeezer(title);
    }catch(error2){
      console.log('Erro capa:', error2);
    }
  }
}

async function updateMetadata(){
  try{
    const data = await fetchJsonWithProxy(BRLOGIC_STATUS_URL);

    const title = normalizeTitle(
      data.currentTrack ||
      data.current_track ||
      data.song ||
      data.title ||
      ''
    );

    if(!title){
      setMusicText('AGUARDANDO');
      return;
    }

    setMusicText(title);
    updateCover(title);

  }catch(error){
    setMusicText('AGUARDANDO');
    console.log('Erro metadata:', error);
  }
}

setMusicText('AGUARDANDO');
updateMetadata();
setInterval(updateMetadata,10000);
</script>

</body>
</html>
